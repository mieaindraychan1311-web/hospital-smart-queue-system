# ============================================================
# Hospital Smart Queue System - application configuration
# ============================================================

spring.datasource.url=${jdbc:postgresql://neondb_owner:npg_oQfPIa21rWpR@ep-green-poetry-ayci2tx5-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${neondb_owner}
spring.datasource.password=${npg_oQfPIa21rWpR}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.application.name=hospital-smart-queue-system

# ---- Server ----
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=always
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# ---- Jackson ----
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Logging ----
logging.level.com.hospitalqueue=INFO
logging.level.org.flywaydb=INFO